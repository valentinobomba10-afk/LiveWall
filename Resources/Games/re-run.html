<!doctype html>
<html lang="en">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/freebuisness/assets@main/260/" />
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>RE:RUN</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0d1020;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        position: fixed;
        inset: 0;
      }

      #unityContainer {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background:
          radial-gradient(circle at 26% 18%, rgba(81, 220, 255, 0.28), transparent 22rem),
          radial-gradient(circle at 78% 82%, rgba(255, 92, 171, 0.25), transparent 24rem),
          #0d1020;
      }

      .loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        color: #f8fbff;
        font-size: clamp(1.35rem, 4vw, 3rem);
        font-weight: 800;
        text-transform: uppercase;
        background:
          linear-gradient(120deg, rgba(13, 16, 32, 0.92), rgba(13, 16, 32, 0.35)),
          radial-gradient(circle at 50% 50%, rgba(255, 209, 102, 0.18), transparent 26rem);
        transition: opacity 180ms ease;
      }

      .loading.is-hidden {
        opacity: 0;
      }
    </style>
    <script src="Build/UnityLoader.js"></script>
  </head>
  <body>
    <main id="unityContainer" aria-label="RE:RUN game"></main>
    <div id="loading" class="loading">Loading RE:RUN</div>

    <script>
      (function () {
        var loading = document.getElementById('loading');

        function hideLoading() {
          if (!loading) return;
          loading.classList.add('is-hidden');
          window.setTimeout(function () {
            loading.style.display = 'none';
          }, 220);
        }

        try {
          window.gameInstance = UnityLoader.instantiate('unityContainer', 'Build/rerundone.json', {
            onProgress: function (_instance, progress) {
              if (loading && progress > 0) {
                loading.textContent = 'Loading RE:RUN ' + Math.round(progress * 100) + '%';
              }
              if (progress >= 1) {
                hideLoading();
              }
            }
          });
          window.setTimeout(hideLoading, 9000);
        } catch (error) {
          if (loading) {
            loading.textContent = 'Tap refresh to try RE:RUN again';
          }
          console.error(error);
        }
      })();
    </script>
  </body>
</html>
