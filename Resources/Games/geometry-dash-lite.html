<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Geometry Dash Lite unavailable</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #070a10;
        color: #f8fbff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 25% 20%, rgba(86, 217, 255, 0.18), transparent 28rem),
          radial-gradient(circle at 75% 80%, rgba(122, 91, 255, 0.16), transparent 30rem),
          #070a10;
      }

      main {
        width: min(620px, 100%);
        padding: clamp(24px, 5vw, 44px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 24px;
        background: rgba(15, 19, 30, 0.82);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.42);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 8vw, 4rem);
        letter-spacing: 0;
      }

      p {
        margin: 0 auto 26px;
        max-width: 38rem;
        color: #b9c3d7;
        font-size: clamp(1rem, 3vw, 1.25rem);
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 22px;
        border-radius: 999px;
        background: linear-gradient(135deg, #66d9ff, #8b7cff);
        color: #06101a;
        font-weight: 900;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Lite is unavailable</h1>
      <p>Geometry Dash Lite is unavailable right now. Please use normal Geo Dash instead.</p>
      <a href="../#/game/geometry-dash" target="_top">Open Normal Geo Dash</a>
    </main>
  </body>
</html>
