<!doctype html><html><head><meta charset="utf-8"><style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#020308}canvas{display:block}</style></head><body><canvas id="c"></canvas><script>
const c=document.querySelector('#c'),x=c.getContext('2d');let live=true,m=[0,0],stars=[];window.liveWallPause=()=>live=false;window.liveWallResume=()=>{live=true;loop()};window.liveWallPointer=(a,b)=>m=[a,b];
function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',size);size();for(let i=0;i<520;i++)stars.push({x:(Math.random()-.5)*innerWidth,y:(Math.random()-.5)*innerHeight,z:Math.random()*innerWidth});
function loop(){if(!live)return;x.fillStyle='rgba(2,3,8,.26)';x.fillRect(0,0,innerWidth,innerHeight);let cx=innerWidth/2+m[0]*innerWidth*.13,cy=innerHeight/2-m[1]*innerHeight*.13;stars.forEach(s=>{s.z-=7;if(s.z<2){s.z=innerWidth;s.x=(Math.random()-.5)*innerWidth;s.y=(Math.random()-.5)*innerHeight}let q=430/s.z,px=cx+s.x*q,py=cy+s.y*q;x.strokeStyle=`hsla(${200+s.z%100},90%,78%,${1-s.z/innerWidth})`;x.lineWidth=q*1.5;x.beginPath();x.moveTo(px,py);x.lineTo(cx+s.x*(430/(s.z+12)),cy+s.y*(430/(s.z+12)));x.stroke()});requestAnimationFrame(loop)}loop();
</script></body></html>
