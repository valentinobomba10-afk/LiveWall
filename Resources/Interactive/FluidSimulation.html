<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body,canvas{width:100%;height:100%;margin:0;display:block;overflow:hidden;background:#050715}</style>
</head><body><canvas id="fluid"></canvas><script>
const canvas=document.getElementById('fluid'), gl=canvas.getContext('webgl',{antialias:false});
let running=true, start=performance.now();
window.liveWallPause=()=>running=false; window.liveWallResume=()=>{running=true; start=performance.now()-time*1000; draw()};
const vert=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const frag=`precision highp float;uniform vec2 r;uniform float t;
float h(vec2 p){return fract(sin(dot(p,vec2(27.1,61.7)))*43758.5);}
void main(){vec2 uv=(gl_FragCoord.xy-.5*r)/r.y;float time=t*.18;vec3 col=vec3(.015,.025,.10);float glow=0.;
for(int i=0;i<7;i++){float f=float(i);vec2 c=vec2(sin(time*(1.+f*.07)+f*2.4),cos(time*(1.18+f*.05)+f*1.7))*.42;
float d=length(uv-c);float wave=.025*sin(d*20.-t*1.8+f);glow+=.035/(d+wave+.035);}
float flow=sin(uv.x*7.+t*.4)+sin(uv.y*8.-t*.32)+sin((uv.x+uv.y)*9.+t*.2);vec3 ink=.5+.5*cos(vec3(0.,2.,4.)+flow*.7+t*.16);
col+=ink*glow*1.45;col+=vec3(.05,.12,.35)*pow(max(0.,1.-length(uv)*1.2),2.);gl_FragColor=vec4(col,1.);}`;
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s}
let prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vert));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,frag));gl.linkProgram(prog);gl.useProgram(prog);
let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
let p=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(p);gl.vertexAttribPointer(p,2,gl.FLOAT,false,0,0);let rr=gl.getUniformLocation(prog,'r'),tt=gl.getUniformLocation(prog,'t'),time=0;
function resize(){let d=devicePixelRatio||1,w=innerWidth*d,h=innerHeight*d;if(canvas.width!=w||canvas.height!=h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}}
function draw(){if(!running)return;resize();time=(performance.now()-start)/1000;gl.uniform2f(rr,canvas.width,canvas.height);gl.uniform1f(tt,time);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(draw)}draw();
</script></body></html>
